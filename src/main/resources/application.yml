spring:
  application:
    name: checkpoint-games-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/checkpoint-games;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: ${PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  jwt:
    secret: ${JWT_SECRET:checkpoint-games-secret-change-this-value-in-production-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
